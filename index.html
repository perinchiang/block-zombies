<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#efe6d1" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="icon" href="data:," />
    <title>方块尸潮</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="gl"></canvas>
    <div id="hurt"></div>
    <div id="hud" hidden>
      <div class="hp"></div>
      <div class="clock" title="末班车离开倒计时">4:00</div>
      <div class="resources"><span class="pressure">压力 <b>0</b><i><em></em></i></span><span class="loot">携带 <b>0</b> 金</span><span class="opened">开箱 <b>0</b></span></div>
      <div class="objective"><div class="phase"></div><div class="navigation"></div><div class="interaction" hidden><span></span><progress max="1" value="0"></progress></div><div class="notice" hidden></div></div>
      <div class="buff-edge" hidden></div>
      <div class="buffs" hidden></div>
      <div class="kills"><b>0</b> 击倒</div>
      <div class="ammo"><b>24</b>/24</div>
      <div class="reload" hidden>换弹…</div>
      <div class="cross"></div>
      <div class="hint"><span class="touch-hint">左侧移动 · 右侧拖动转向 · 按住开火</span><span class="desktop-hint">WASD 移动 · 鼠标转向/开火 · F 转身</span></div>
      <div class="stick"><div class="knob"></div></div>
      <div class="fire">开火</div>
      <div class="turn">转身</div>
      <div class="threats"></div>
    </div>
    <div id="panel" hidden></div>
    <div id="rotate" hidden>请把手机横过来</div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
