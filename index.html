<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#efe6d1" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="icon" href="data:," />
    <title>方块尸潮</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="gl"></canvas>
    <div id="hurt"></div>
    <div id="hud" hidden>
      <div class="hp"></div>
      <div class="clock" title="当前关卡与波次">Day 1 · 波 1/3</div>
      <div class="interaction" hidden><progress max="1" value="0"></progress></div>
      <div class="buff-edge" hidden></div>
      <div class="buffs" hidden></div>
      <div class="kills"><b>0</b> 击倒</div>
      <div class="coins" aria-live="polite"><b>0</b> 金币</div>
      <div class="notice" aria-live="polite"></div>
      <div class="ammo"><b>24</b>/24</div>
      <div class="gun-tag" aria-hidden="true"></div>
      <div class="reload" hidden>换弹…</div>
      <div class="cross"></div>
      <div class="stick"><div class="knob"></div></div>
      <div class="fire">开火</div>
      <button class="pause" type="button" aria-label="暂停">Ⅱ</button>
      <div class="threats"></div>
      <div class="floaters" aria-hidden="true"></div>
    </div>
    <div id="panel" hidden></div>
    <div id="rotate" hidden>请把手机横过来</div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
